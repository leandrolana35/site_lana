name: Deploy to Hostgator via Webhook

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment webhook
        run: |
          response=$(curl -s -X POST "https://llana.com.br/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}")
          echo "Response: $response"
          if echo "$response" | grep -q "sucesso"; then
            echo "Deploy realizado com sucesso!"
          else
            echo "Falha no deploy: $response"
            exit 1
          fi
