name: Deploy to Hostgator via Webhook

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment webhook
        run: |
          response=$(curl -s -A "Mozilla/5.0" -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" "https://llana.com.br/deploy.php")
          echo "Response: $response"
          if echo "$response" | grep -q "sucesso"; then
            echo "Deploy realizado com sucesso!"
          else
            echo "Falha no deploy: $response"
            exit 1
          fi
